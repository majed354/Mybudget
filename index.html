<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">﷼</span>
      <div>
        <strong>ميزانيتي</strong>

      </div>
    </div>
    <!-- رقم النسخة في الترويسة لا في قاع الإعدادات: أكثرُ ما أربك استعمال
         هذا التطبيق شيفرةٌ قديمة على الجهاز، ومعرفةُ ذلك تبدأ بنظرة.
         وهو زرّ: يفحص التحديث ويُحمّل إن وُجد. -->
    <button id="ver" class="ver-chip" type="button" title="اضغط للتحقّق من التحديث"></button>
    <!-- وجهتان نادرتان: تظهران هنا على الجوال وحده، وفي #nav على الشاشات الواسعة -->
    <div class="head-actions">
      <!-- سحب الرسائل فعلٌ يُكرَّر في اليوم مرات، فمكانه مع أقرب الأزرار
           لا في قاع الإعدادات خلف بطاقةٍ مطويّة -->
      <button id="drain" type="button" aria-label="حدّث الآن: مزامنة ورسائل" title="حدّث الآن — يسحب نسختك ورسائل مصرفك ويرفع ما تغيّر">🔄</button>
      <a href="#import" data-route="import" aria-label="الاستيراد" title="الاستيراد">📥</a>
      <a href="#settings" data-route="settings" aria-label="الإعدادات" title="الإعدادات">⚙️</a>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <p class="privacy">🔒 كل بياناتك تبقى داخل متصفحك.<br>لا خادم، ولا رفع، ولا تتبّع.</p>
    </div>
  </aside>

  <main>
    <div id="banner" class="banner"></div>
    <div id="app" class="app"></div>

</div>
<div id="toast" class="toast"></div>
<script type="module" src="src/main.js"></script>
<script>
  /*
   * تحديث الشيفرة على الجهاز — أكثرُ ما أربك استعمال هذا التطبيق.
   *
   * عامل الخدمة يأخذ مكان سابقه فورًا (skipWaiting وclients.claim)، لكن
   * الصفحة المفتوحة تبقى على وحداتها القديمة حتى تُحمَّل من جديد. وعلى
   * الجوال قلّما تُغلق: يبقى المستخدم على شيفرة الأمس فيرى عطبًا أُصلح،
   * ويظن أن الإصلاح لم ينفع. فحين يتولّى عاملٌ جديد، نُحمّل مرة واحدة.
   * والحارس ضروري: بلا `reloaded` تدور الصفحة في حلقة تحميلٍ لا تنتهي.
   */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
    // ويُسأل عن جديدٍ عند كل عودة إلى التطبيق، فلا ينتظر المستخدم صدفة
    const check = () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then((r) => r?.update()).catch(() => {}); };
    document.addEventListener('visibilitychange', check);
    addEventListener('focus', check);
  }
</script>
</body>
</html>
